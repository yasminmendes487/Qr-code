<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | QR code component</title>
  </head>
  <body>
    <main class="page">
      <div class="card">
        <a class="card__image-link" href="https://www.frontendmentor.io" target="_blank" rel="noopener noreferrer">
          <img class="card__image" src="./images/image-qr-code.png" alt="Scan this QR code to visit Frontend Mentor and improve your front-end skills" />
        </a>
        <div class="card__content">
          <h1 class="card__title">Improve your front-end skills by building projects</h1>
          <p class="card__text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
        </div>
      </div>
    </main>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/yasminmendes487">Yasmin Mendes</a>.
    </footer>
  </body>
</html>
